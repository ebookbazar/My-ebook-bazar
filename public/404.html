<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <title>eBookBazar – ডিজিটাল বই মার্কেটপ্লেস ও লার্নিং হাব</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 1 because the repository URL subpath is /My-ebook-bazar/
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px 20px;">
      <h2>রিডাইরেক্ট হচ্ছে...</h2>
      <p>অনুগ্রহ করে অপেক্ষা করুন, আপনাকে সঠিক পেজে নিয়ে যাওয়া হচ্ছে।</p>
    </div>
  </body>
</html>
